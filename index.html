<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gracias | Norte Arte Subastas</title>
<meta name="description" content="Gracias por ser parte de la primera subasta 100% online de Norte Arte Subastas.">
<meta property="og:title" content="Gracias | Norte Arte Subastas">
<meta property="og:description" content="Más de 50 años de trayectoria. ¡Hasta la próxima subasta!">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--gold:#d8b878;--gold2:#a8834a;--text:#f3ece0}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:radial-gradient(ellipse at 50% 35%,#3a2c22 0%,#1c1612 55%,#0e0b09 100%);color:var(--text);font-family:Lora,Georgia,serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:4rem 1.25rem}
main{max-width:760px;width:100%}
.brand{font-family:Cinzel,serif;letter-spacing:.45em;color:var(--gold);font-size:clamp(.8rem,2.5vw,1.1rem)}
.line{width:90px;height:1px;background:var(--gold2);margin:1rem auto 1.5rem}
h1{font-family:Cinzel,serif;font-weight:500;font-size:clamp(3.5rem,14vw,7.5rem);line-height:1;background:linear-gradient(180deg,#f3dca6,#c49a55 60%,#8f6a35);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(1.2rem,4vw,1.9rem);line-height:1.4;margin-top:1.5rem}
em{color:var(--gold);font-size:1.15em}
.gallery{display:flex;justify-content:center;align-items:center;gap:clamp(.5rem,3vw,1.5rem);margin:3rem 0}
.gallery img{width:27%;filter:drop-shadow(0 18px 25px rgba(0,0,0,.6));transition:transform .4s}
.gallery img.c{width:32%}
.gallery img:hover{transform:scale(1.05)}
.fin{font-size:clamp(1.3rem,4.5vw,2rem);font-weight:500;line-height:1.3}
.fin+p{color:var(--gold);font-style:italic;font-size:clamp(1.1rem,4vw,1.7rem);margin-top:.5rem}
main>*{animation:up .9s ease both}main>*:nth-child(n+4){animation-delay:.3s}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
</style>
</head>
<body>
<main>
  <p class="brand">NORTE ARTE SUBASTAS</p>
  <div class="line"></div>
  <h1>GRACIAS</h1>
  <p class="lead">por confiar en nuestros más de<br><em>50 años de trayectoria</em><br>y ser parte de la primera<br>subasta 100% online</p>
  <div class="gallery">
    <img src="img/izq.png" alt="Paisaje enmarcado">
    <img class="c" src="img/centro.png" alt="Retrato de niño enmarcado">
    <img src="img/der.png" alt="Escena de figuras enmarcada">
  </div>
  <div class="line"></div>
  <p class="fin">Felicitaciones a todos<br>los compradores</p>
  <p>¡Hasta la próxima subasta!</p>
</main>
</body>
</html>
